# Codemagic CI/CD: 100% Free Tier Configuration (No Credit Card Required)
# Free Plan: 500 build minutes/month on Apple Silicon M2 (mac_mini_m2)
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # 1. Android Release Workflow (Runs on free mac_mini_m2 with pre-installed Android SDK)
  # ----------------------------------------------------------------------------
  android-release:
    name: "Android Release (APK)"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Scaffold & Configure Native Platforms
        script: |
          flutter create --org com.luc4n3x --project-name levyra_universal .
          python3 scripts/configure_platforms.py
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run Unit Tests
        script: |
          flutter test
      - name: Build Android APK
        script: |
          flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # ----------------------------------------------------------------------------
  # 2. iOS Release Workflow (Builds .ipa for AltStore / SideStore / TrollStore / Scarlet)
  # ----------------------------------------------------------------------------
  ios-release:
    name: "iOS Release (IPA Package)"
    max_build_duration: 35
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Scaffold & Configure Native Platforms
        script: |
          flutter create --org com.luc4n3x --project-name levyra_universal .
          python3 scripts/configure_platforms.py
      - name: Setup iOS & dependencies
        script: |
          flutter pub get
      - name: Run Unit Tests
        script: |
          flutter test
      - name: Build iOS Application & IPA Package
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y LevyraMusic-iOS.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa
      - build/ios/iphoneos/Runner.app

  # ----------------------------------------------------------------------------
  # 3. macOS Desktop Workflow (Native Apple Silicon & Intel macOS app)
  # ----------------------------------------------------------------------------
  macos-release:
    name: "macOS Desktop Release (.app & .zip)"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Enable macOS Desktop & Scaffold
        script: |
          flutter config --enable-macos-desktop
          flutter create --org com.luc4n3x --project-name levyra_universal .
          python3 scripts/configure_platforms.py
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Run Unit Tests
        script: |
          flutter test
      - name: Build macOS Application
        script: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r -y LevyraMusic-macOS.zip LevyraMusic.app
    artifacts:
      - build/macos/Build/Products/Release/*.zip
      - build/macos/Build/Products/Release/*.app

  # ----------------------------------------------------------------------------
  # 4. Multi-Build (Android + iOS + macOS all in ONE build job!)
  # ----------------------------------------------------------------------------
  all-apple-and-android:
    name: "All-in-One Release (Android APK + iOS IPA + macOS Desktop)"
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      java: 17
    scripts:
      - name: Scaffold & Configure Native Platforms
        script: |
          flutter config --enable-macos-desktop
          flutter create --org com.luc4n3x --project-name levyra_universal .
          python3 scripts/configure_platforms.py
          flutter pub get
          flutter test
      - name: Build Android APK
        script: |
          flutter build apk --release --split-per-abi
      - name: Build iOS IPA
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y LevyraMusic-iOS.ipa Payload
          cd ../../..
      - name: Build macOS App
        script: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r -y LevyraMusic-macOS.zip LevyraMusic.app
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/iphoneos/*.ipa
      - build/macos/Build/Products/Release/*.zip
