# ==============================================================================
# Azure Pipelines CI/CD: Multi-Platform Cloud Build Matrix for Levyra Music
# Free Tier: 1,800 build minutes/month on Microsoft-hosted macOS, Windows, Linux
# 100% independent from GitHub Actions and local hardware
# ==============================================================================

trigger:
  - main
  - master

stages:
  # ----------------------------------------------------------------------------
  # Stage 1: Android & Linux (Ubuntu Runner)
  # ----------------------------------------------------------------------------
  - stage: BuildLinuxAndAndroid
    displayName: "Build Android & Linux on Ubuntu"
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: AndroidBuild
        displayName: "Build Android APK"
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: "17"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"
          - script: |
              git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
              echo "##vso[task.prependpath]$HOME/flutter/bin"
            displayName: "Install Flutter SDK"
          - script: |
              flutter create --org com.luc4n3x --project-name levyra_music .
              python3 scripts/configure_platforms.py
              flutter pub get
              flutter test
              flutter build apk --release --split-per-abi
            displayName: "Build APK"
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: "build/app/outputs/flutter-apk"
              ArtifactName: "android-apk"

      - job: LinuxBuild
        displayName: "Build Linux Desktop Bundle"
        steps:
          - script: |
              sudo apt-get update -y
              sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
              git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
              echo "##vso[task.prependpath]$HOME/flutter/bin"
            displayName: "Setup Linux Prerequisites & Flutter"
          - script: |
              flutter config --enable-linux-desktop
              flutter create --org com.luc4n3x --project-name levyra_music .
              python3 scripts/configure_platforms.py
              flutter pub get
              flutter build linux --release
              tar -czvf $(Build.ArtifactStagingDirectory)/LevyraMusic-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
            displayName: "Build Linux Bundle"
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)/LevyraMusic-Linux-x64.tar.gz"
              ArtifactName: "linux-desktop"

  # ----------------------------------------------------------------------------
  # Stage 2: Apple Ecosystem (macOS Desktop & iOS on macOS Hosted Runner)
  # ----------------------------------------------------------------------------
  - stage: BuildApple
    displayName: "Build macOS & iOS on Apple Runner"
    pool:
      vmImage: "macOS-latest"
    jobs:
      - job: MacOSBuild
        displayName: "Build macOS .app & .zip"
        steps:
          - script: |
              git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
              echo "##vso[task.prependpath]$HOME/flutter/bin"
            displayName: "Install Flutter SDK"
          - script: |
              flutter config --enable-macos-desktop
              flutter create --org com.luc4n3x --project-name levyra_music .
              python3 scripts/configure_platforms.py
              flutter pub get
              flutter test
              flutter build macos --release
              cd build/macos/Build/Products/Release
              zip -r -y $(Build.ArtifactStagingDirectory)/LevyraMusic-macOS.zip LevyraMusic.app
            displayName: "Compile macOS App"
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)/LevyraMusic-macOS.zip"
              ArtifactName: "macos-desktop"

      - job: IOSBuild
        displayName: "Build iOS IPA Package"
        steps:
          - script: |
              git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
              echo "##vso[task.prependpath]$HOME/flutter/bin"
            displayName: "Install Flutter SDK"
          - script: |
              flutter create --org com.luc4n3x --project-name levyra_music .
              python3 scripts/configure_platforms.py
              flutter pub get
              flutter test
              flutter build ios --release --no-codesign
              cd build/ios/iphoneos
              mkdir -p Payload
              cp -r Runner.app Payload/
              zip -r -y $(Build.ArtifactStagingDirectory)/LevyraMusic-iOS.ipa Payload
            displayName: "Compile iOS App & Package IPA"
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)/LevyraMusic-iOS.ipa"
              ArtifactName: "ios-ipa"

  # ----------------------------------------------------------------------------
  # Stage 3: Windows Desktop (Windows Server Hosted Runner)
  # ----------------------------------------------------------------------------
  - stage: BuildWindows
    displayName: "Build Windows Desktop on Windows Runner"
    pool:
      vmImage: "windows-latest"
    jobs:
      - job: WindowsBuild
        displayName: "Build Windows .exe"
        steps:
          - script: |
              git clone https://github.com/flutter/flutter.git -b stable --depth 1 %USERPROFILE%\flutter
              echo ##vso[task.prependpath]%USERPROFILE%\flutter\bin
            displayName: "Install Flutter SDK"
          - script: |
              flutter config --enable-windows-desktop
              flutter create --org com.luc4n3x --project-name levyra_music .
              python scripts/configure_platforms.py
              flutter pub get
              flutter test
              flutter build windows --release
              powershell -Command "Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $(Build.ArtifactStagingDirectory)\LevyraMusic-Windows-x64.zip"
            displayName: "Compile Windows App"
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)/LevyraMusic-Windows-x64.zip"
              ArtifactName: "windows-desktop"
