name: levyra_music
description: "Cross-platform universal music player and downloader (Levyra Standards)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Parsers
  http: ^1.2.0
  dio: ^5.4.1
  crypto: ^3.0.3
  xml: ^6.5.0
  intl: ^0.19.0

  # State Management & Architecture
  provider: ^6.1.2

  # Icons & Fonts
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
